<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Secure DMZ Operations</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .dashboard { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 500px; border: 1px solid #334155; }
        h1 { font-size: 22px; margin-bottom: 10px; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        .badge { background: #065f46; color: #34d399; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        .card span { display: block; color: #94a3b8; font-size: 12px; margin-bottom: 5px; }
        .card b { color: #f1f5f9; font-size: 14px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>DMZ Network Security <span class="badge">SECURE</span></h1>
        <p style="color: #94a3b8; font-size: 14px;">3계층 망 분리 및 방화벽 패킷 필터링 시스템</p>
        <div class="grid">
            <div class="card">
                <span>WEB SERVICE</span>
                <b>Nginx (Port 80)</b>
            </div>
            <div class="card">
                <span>FIREWALL STATUS</span>
                <b style="color: #34d399;">Default Deny 적용</b>
            </div>
            <div class="card">
                <span>AUTO-HEALING</span>
                <b style="color: #38bdf8;">Active (5s Recovery)</b>
            </div>
            <div class="card">
                <span>INTRUSION PREVENTION</span>
                <b style="color: #38bdf8;">Fail2ban Monitoring</b>
            </div>
        </div>
    </div>
</body>
</html>
