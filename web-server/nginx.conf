
# Nginx 웹서버 설정

server {
    # 웹서버 포트 설정
    listen 80;
    server_name _;

    # 웹페이지 파일 위치
    root /usr/share/nginx/html;
    index index.html;

    # 오류 발생 시 지정한 페이지 표시
    error_page 403 /403.html;
    error_page 404 /404.html;

    # 기본 페이지 요청 처리
    location / {
        try_files $uri $uri/ =404;
    }

    # 403 오류 확인용 주소
    location = /restricted-demo {
        deny all;
    }

    # 오류 페이지를 내부에서만 사용
    location = /403.html {
        internal;
    }

    location = /404.html {
        internal;
    }

    # 웹서버 상태 확인
    location = /health {
        # 반복되는 상태 확인 로그 제외
        access_log off;

        # 정상 상태일 때 OK 반환
        default_type text/plain;
        return 200 "OK";
    }
}